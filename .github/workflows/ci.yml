name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  security-events: write
  # github/codeql-action/upload-sarif calls the "get a workflow run" REST endpoint (for its own
  # run-metadata/telemetry lookup) — without this it fails with "Resource not accessible by
  # integration" even though the SARIF upload itself only needs security-events: write.
  actions: read

jobs:
  build-and-test:
    name: Build & test (.NET)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore ConexaoSolidaria.slnx

      - name: Build
        run: dotnet build ConexaoSolidaria.slnx --configuration Release --no-restore

      - name: Test (xUnit — Identity/Campaigns/Donations Domain)
        run: dotnet test ConexaoSolidaria.slnx --configuration Release --no-build --logger "trx;LogFileName=test-results.trx"

      - name: Publish test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: "**/test-results.trx"

  docker:
    name: Build, scan & publish (${{ matrix.service.name }})
    needs: build-and-test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - name: identity-api
            context: Identity.Api
            dockerfile: Identity.Api/Dockerfile
          - name: campaigns-api
            context: Campaigns.Api
            dockerfile: Campaigns.Api/Dockerfile
          - name: donations-worker
            context: Donations.Worker
            dockerfile: Donations.Worker/Dockerfile
    steps:
      - uses: actions/checkout@v4

      # GHCR requires the image path lowercase; github.repository_owner can be mixed case.
      - name: Compute image name
        run: |
          echo "IMAGE=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')/${{ matrix.service.name }}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - name: Build image (local only — not pushed yet)
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.service.context }}
          file: ${{ matrix.service.dockerfile }}
          push: false
          load: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest

      - name: Trivy — full report (uploaded to Security tab, never fails the job)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ github.sha }}
          format: sarif
          output: trivy-results.sarif
          severity: "CRITICAL,HIGH,MEDIUM"
          exit-code: "0"

      - name: Upload Trivy results to GitHub Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results.sarif

      - name: Trivy — gate on CRITICAL vulnerabilities (fails the build)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ github.sha }}
          format: table
          severity: "CRITICAL"
          exit-code: "1"
          ignore-unfixed: true

      # Only publish from a real push to main — never from a pull_request (no push rights
      # needed there, and PR images shouldn't land in the registry).
      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker push ${{ env.IMAGE }}:${{ github.sha }}
          docker push ${{ env.IMAGE }}:latest
