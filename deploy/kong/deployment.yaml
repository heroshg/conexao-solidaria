apiVersion: apps/v1
kind: Deployment
metadata:
  name: kong
  namespace: conexao-solidaria
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kong
  template:
    metadata:
      labels:
        app: kong
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        # kong's image declares its "kong" user by NAME, not numeric uid — kubelet can't
        # verify a symbolic user is non-root from image metadata alone and refuses to start
        # ("cannot verify user is non-root") unless the uid is spelled out explicitly here.
        runAsUser: 1000
      containers:
        - name: kong
          image: kong:3.7@sha256:5d46b1fcb0c29a1e5739499ca8d7af9ce6a6531ab37d9ae42f49478103a4c4dc
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 768Mi
          env:
            - name: KONG_DATABASE
              value: "off"
            # Kong auto-sizes nginx worker processes off the NODE's detected CPU count, not
            # this container's cpu limit — left at "auto" it spawned a worker per host core,
            # starved for CPU under the limit above, and /status probes started timing out
            # (confirmed live: readiness/liveness failures, repeated restarts). Pinning it
            # keeps worker count predictable regardless of the underlying node.
            - name: KONG_NGINX_WORKER_PROCESSES
              value: "2"
            - name: KONG_DECLARATIVE_CONFIG
              value: /kong/declarative/kong.yml
            - name: KONG_PROXY_LISTEN
              value: "0.0.0.0:8000"
            - name: KONG_ADMIN_LISTEN
              value: "0.0.0.0:8001"
            - name: KONG_PROXY_ACCESS_LOG
              value: /dev/stdout
            - name: KONG_ADMIN_ACCESS_LOG
              value: /dev/stdout
            - name: KONG_PROXY_ERROR_LOG
              value: /dev/stderr
            - name: KONG_ADMIN_ERROR_LOG
              value: /dev/stderr
          ports:
            - containerPort: 8000
              name: proxy
            - containerPort: 8001
              name: admin
          volumeMounts:
            - name: kong-config
              mountPath: /kong/declarative
              readOnly: true
          readinessProbe:
            httpGet:
              path: /status
              port: 8001
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /status
              port: 8001
            initialDelaySeconds: 15
            periodSeconds: 10
      volumes:
        - name: kong-config
          configMap:
            name: kong-config
