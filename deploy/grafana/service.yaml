apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: conexao-solidaria
spec:
  selector:
    app: grafana
  ports:
    - port: 3000
      targetPort: 3000
  # Reach the UI for the demo via:
  # kubectl port-forward svc/grafana 3000:3000 -n conexao-solidaria
  # login: admin / admin (dev only — see deployment.yaml)
