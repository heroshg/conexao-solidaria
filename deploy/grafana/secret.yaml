# Dev/demo credentials only, same spirit as deploy/postgres/secret.yaml. Kept as a Secret
# (rather than a plaintext env value in deployment.yaml) so at least `kubectl get deployment -o
# yaml` doesn't show it directly — `kubectl get secret -o yaml` still would, same as every
# other Secret in this repo; this is dev/demo, not a real deployment.
apiVersion: v1
kind: Secret
metadata:
  name: grafana-admin-credentials
  namespace: conexao-solidaria
type: Opaque
stringData:
  GF_SECURITY_ADMIN_USER: admin
  GF_SECURITY_ADMIN_PASSWORD: admin
