apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: conexao-solidaria
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s

    scrape_configs:
      - job_name: prometheus
        static_configs:
          - targets: ["localhost:9090"]

      # One job per .NET service Service — all three already expose /metrics via
      # prometheus-net.AspNetCore (UseHttpMetrics + MapMetrics), see CLAUDE.md "Observabilidade".
      - job_name: identity-api
        metrics_path: /metrics
        static_configs:
          - targets: ["identity-api:8080"]

      - job_name: campaigns-api
        metrics_path: /metrics
        static_configs:
          - targets: ["campaigns-api:8080"]

      - job_name: donations-worker
        metrics_path: /metrics
        static_configs:
          - targets: ["donations-worker:8080"]
