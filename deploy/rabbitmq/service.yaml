apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
  namespace: conexao-solidaria
spec:
  selector:
    app: rabbitmq
  ports:
    - name: amqp
      port: 5672
      targetPort: 5672
    - name: management
      port: 15672
      targetPort: 15672
  # ClusterIP: reach the management UI for the demo via
  # `kubectl port-forward svc/rabbitmq 15672:15672 -n conexao-solidaria` (kind nodes aren't
  # exposed on the host by default, so NodePort alone wouldn't be reachable from Windows).
