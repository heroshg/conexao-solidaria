# Dev/demo credentials only, same spirit as deploy/postgres/secret.yaml — replaces the
# guest/guest default that Campaigns.Api and Donations.Worker used to authenticate with (both
# reachable cluster-wide via the rabbitmq Service, confirmed live). Note: RabbitMQ's built-in
# "guest" account still technically exists alongside this one (the official image doesn't
# remove it just because RABBITMQ_DEFAULT_USER/PASS are set) — deleting it would need an extra
# rabbitmqctl step at container start, out of scope here; the point of this Secret is that none
# of our own services authenticate with it anymore.
apiVersion: v1
kind: Secret
metadata:
  name: rabbitmq-credentials
  namespace: conexao-solidaria
type: Opaque
stringData:
  RABBITMQ_DEFAULT_USER: donations_app
  RABBITMQ_DEFAULT_PASS: donations_app_dev_pw
